name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag zgodny z plikiem VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with:
          name: gryps-deb
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: gryps-macos-macos-latest
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: gryps-windows-gitbash
          path: dist
      - name: Weryfikacja pełnego zestawu Assets
        run: sh packaging/verify-release.sh
      - name: Notatki z CHANGELOG
        run: |
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \\[?" v "(\\]|[[:space:]])" {f=1; next}
            /^## / && f {exit}
            f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Draft, upload, kontrola Assets, publikacja
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh packaging/publish-release.sh "$RELEASE_TAG" notes.md
