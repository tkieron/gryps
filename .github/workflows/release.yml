name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag zgodny z plikiem VERSION
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nie pasuje do VERSION ($(cat VERSION))"
            exit 1
          fi

      - name: Testy i budowa
        run: |
          make test
          make deb
          make macos
          cp dist/gryps dist/gryps.1 .

      - name: Notatki z CHANGELOG
        run: |
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \[?" v "(\]|[[:space:]])" {f=1; next}
            /^## / && f {exit}
            f' CHANGELOG.md > notes.md
          cat notes.md

      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Gryps $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/gryps_*_all.deb dist/gryps-*-macos.tar.gz dist/gryps-*-macos.zip gryps
